# Cross-model assay consensus pipeline config (pipeline.assays_consensus.yaml).
# Per-model extraction (pipeline.assays.yaml) reuses env.kec.yaml (models block + model_key).
# Each model_key must have {{products}}/{{model_key}}/assays.json from a per-model run.

aop_xml:
  "20260401":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-04-01.xml"
  "20260701":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-07-01.xml"

version: "20260701"

products: "../aopmapper-curation-data/aopwiki_20260701/ASSAYS/assays/"

models:
  "BrainForge--Devstral-2-123B-Instruct-2512-NVFP4":
    model_llm: "BrainForge/Devstral-2-123B-Instruct-2512-NVFP4"
    threads: 32

  "google--gemma-3-27b-it":
    model_llm: "google/gemma-3-27b-it"
    threads: 64

  "google--gemma-4-26B-A4B-it":
    model_llm: "google/gemma-4-26B-A4B-it"
    temperature: 1.0
    extra_body:
      top_p: 0.95
      top_k: 64

  "ibm-granite--granite-4.0-h-small-FP8":
    model_llm: "ibm-granite/granite-4.0-h-small-FP8"
    threads: 256

  "inclusionAI--Ling-2.6-flash-int4":
    model_llm: "inclusionAI/Ling-2.6-flash-int4"
    threads: 256

  "nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4":
    model_llm: "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
    temperature: 1.0
    extra_body:
      top_p: 0.95

  "poolside--Laguna-S-2.1-NVFP4":
    model_llm: "poolside/Laguna-S-2.1-NVFP4"
    threads: 32
    temperature: 0.7
    extra_body:
      top_p: 0.95
      think: false

  "radm--Athene-V2-Chat-AWQ":
    model_llm: "radm/Athene-V2-Chat-AWQ"
    max_tokens: 24576
    threads: 80

  "rdtand--Gemma4-31B-IT-PrismaQuant-5.5bit-vllm":
    model_llm: "rdtand/Gemma4-31B-IT-PrismaQuant-5.5bit-vllm"
    threads: 64

  "rdtand--Gemma4-31B-IT-PrismaQuant-6bit-vllm":
    model_llm: "rdtand/Gemma4-31B-IT-PrismaQuant-6bit-vllm"
    threads: 64

  "rdtand--Qwen3.6-27B-PrismaAURA-5.5bit-vllm":
    model_llm: "rdtand/Qwen3.6-27B-PrismaAURA-5.5bit-vllm"
    threads: 64
    temperature: 0.6
    extra_body:
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0

# The assay-extraction panel to compare (folder names under {{products}}).
# Restricted to the 11-model KEC116 pareto_smaa (lambda=32) ensemble, see
# aopmapper-curation-data/aopwiki_20260401/KEC116/crossmodel/crossmodel_new_tiebreak2/default/pareto_smaa/ensemble_models.tsv
# order follows that file's ranking by curated triples covered (n_triples_covered_of_145, descending).
model_keys:
  - "rdtand--Gemma4-31B-IT-PrismaQuant-5.5bit-vllm"
  - "radm--Athene-V2-Chat-AWQ"
  - "BrainForge--Devstral-2-123B-Instruct-2512-NVFP4"
  - "inclusionAI--Ling-2.6-flash-int4"
  - "rdtand--Gemma4-31B-IT-PrismaQuant-6bit-vllm"
  - "nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
  - "google--gemma-4-26B-A4B-it"
  - "poolside--Laguna-S-2.1-NVFP4"
  - "rdtand--Qwen3.6-27B-PrismaAURA-5.5bit-vllm"
  - "ibm-granite--granite-4.0-h-small-FP8"
  - "google--gemma-3-27b-it"

embedding_model: "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
tau: 0.70          # assay-name matching threshold (tune on a sample; ≠ KEC 0.75)
min_support: 2     # an assay is "consensus" if ≥ this many models agree

ke_filter:
  ke_ids: null              # e.g. ["KE1392", "KE881"]
  oecd_status:  null  # e.g. "endorsed"
  limit: 0               # e.g. 10


model_key: "nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"

extract_assays: true