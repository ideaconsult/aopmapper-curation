# Cross-model assay consensus pipeline config (pipeline.assays_consensus.yaml).
# Per-model extraction (pipeline.assays.yaml) reuses env.kec.yaml (models block + model_key).
# Each model_key must have {{products}}/{{model_key}}/assays.json from a per-model run.

aop_xml:
  "20260401":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-04-01.xml"      
  "20260701":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-07-01.xml"      

#version: "20260401"
version: "20260701"

products: "../aopmapper-curation-data/aopwiki_20260701/ASSAYS/"

# same ensemble models as selected by KEC116
model_keys:
  - "BrainForge--Devstral-2-123B-Instruct-2512-NVFP4"
  - "google--gemma-3-27b-it"
  - "google--gemma-4-26B-A4B-it"
  - "ibm-granite--granite-4.0-h-small-FP8"
  - "nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
  - "poolside--Laguna-S-2.1-NVFP4"
  - "Qwen--Qwen3.6-27B"
  - "radm--Athene-V2-Chat-AWQ"
  - "rdtand--Gemma4-31B-IT-PrismaQuant-5.5bit-vllm"
  - "rdtand--Gemma4-31B-IT-PrismaQuant-6bit-vllm"


embedding_model: "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
# Assay-name matching threshold (≠ KEC 0.75; see tasks/assay_compare.py). Set by
# inspecting pairs that should and should not match: true positives 0.70-1.00, true
# negatives 0.39-0.64. At the previous 0.80 the same assay written two ways failed to
# merge ("HPRT assay (OECD TG476)" vs "HPRT Mutation Assay" = 0.73), which split
# clusters and depressed support counts.
tau: 0.70
min_support: 2     # an assay is "consensus" if ≥ this many models agree

# Publish acceptance threshold: the minimum support an assay cluster needs to be
# published (the publishing stage itself is not part of this repo).
# viz_assay_consensus's support-bar color uses THIS, not min_support above, so the
# report shows exactly what will/won't be published - same split as
# env.consensus.yaml's min_support_ensemble for the KEC track.
assay_min_support: 2

# ── D5 — cross-track consistency (response_plan.md, R1 §5.3) ──────────────────────
# Per-model: does this model's own assay-derived kec_triple (from measurement_methodology
# text) agree with its own KEC-track triple (from the KE description) for the same KE?
# Needs a settled KEC run for the SAME panel + AOP-Wiki release as this assay run —
# point kec_products at it explicitly (no implicit coupling to another pipeline's config).
# enabled: false (default) → crossmodel_track_consistency writes nothing,
# cross_track_consistency stays blank in assay_model_summary.csv, and any ranking_config
# variant listing it as a criterion falls back to smaa_rank's median-imputation. Flip on
# once both tracks are extracted for the same panel/release, matching kec_all_crossmodel_dir
# in env.manuscript.yaml.
track_consistency:
  enabled: true
  kec_products: "../aopmapper-curation-data/aopwiki_20260701/KEC_ALL"
  tau: 0.75        # KEC-track matching threshold (tasks.kec_compare.DEFAULT_TAU) — kept
                    # separate from the assay-name `tau` above, same as env.consensus.yaml

# ── SMAA ranking configs ──────────────────────────────────────────────────────
# Named parameter blocks for the smaa_rank_assays task, picked by `ranking:` below —
# same pattern as env.consensus.yaml (KEC track). The chosen block's keys override the
# smaa_rank task defaults, so one pipeline entry drives several ranking variants by
# name. Which criteria a variant uses is set entirely by its `criteria` list. Any
# smaa_rank parameter is valid here (criteria, criteria_weights, weight_concentration,
# n_iter, seed, …).
#
# iri_valid_frac     = ontology_terms IRIs only (the committed criterion)
# kec_iri_valid_frac = kec_triple slot IRIs, scored as a SEPARATE population by
#                      validate_assay_iris — opt in via the kec_iri block below.
#                      Kept apart so adding it never silently shifts the default
#                      ranking; needs a re-run of validate_assay_iris (and assay
#                      extraction with kec_triple) to be non-empty.
ranking_config:
  default:                 # committed behaviour — unchanged rankings
    criteria: ["consensus_agreement", "evidence_grounded_frac",
               "iri_valid_frac", "direction_margin_auc"]

  no_logprob:              # default minus the logprob criterion (direction_margin_auc)
    criteria: ["consensus_agreement", "evidence_grounded_frac", "iri_valid_frac"]

  kec_iri:                 # default + KEC-triple IRI validity as its own criterion
    criteria: ["consensus_agreement", "evidence_grounded_frac",
               "iri_valid_frac", "kec_iri_valid_frac", "direction_margin_auc"]

  cross_track:              # default + D5 cross-track consistency (needs track_consistency
                             # .enabled: true above and a matching kec_products run, else
                             # the criterion is all-missing and smaa_rank drops it with a
                             # warning rather than failing). cross_track_consistency = primary
                             # rule (object/process only, action excluded — see
                             # crossmodel_track_consistency.py docstring); swap in
                             # "cross_track_consistency_strict" (+action required) here to
                             # rank on the stricter variant instead.
    criteria: ["consensus_agreement", "evidence_grounded_frac",
               "iri_valid_frac", "direction_margin_auc", "cross_track_consistency"]

ranking: "default"

#crossmodel: "crossmodel_new_tiebreak2_2"
crossmodel: "manuscript"

viz_restrict_to_ensemble: False
# slim output keeps the sidecar under GitHub's 100 MiB file limit by reducing logprobs to the endpoint-direction margin
viz_slim_data: True
