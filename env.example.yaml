# Template for env.kec.yaml / env.assays.yaml — copy and edit for your own run.
# See README.md for how these env files map to the pipeline.*.yaml entry points.

aop_xml:
  "20260401":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      # Download the release XML from AOP-Wiki (https://aopwiki.org) yourself —
      # it is third-party data and not redistributed in this repo.
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-04-01.xml"

version: "20260401"

# Where pipeline outputs are written, relative to the repo root (gitignored).
products: "products/example"

# Optional KE subset filter, referenced as {{ke_filter}} in the pipeline.
ke_filter:
  ke_ids: null              # e.g. ["KE1392", "KE881"]
  oecd_status: "endorsed"   # e.g. "endorsed", or null for the full corpus
  limit: 0                  # e.g. 10, for a quick smoke test; 0 = no limit

# The model panel. Each entry's `base_url` should point at your own OpenAI-compatible
# inference endpoint (vLLM, Ollama, OpenRouter, ...); if omitted it falls back to the
# AOP4ENM_LLM_BASE_URL env var, then to http://localhost:8000/v1. `api_key` names an
# environment variable to read the key from (never a literal secret).
models:
  "my-local-model":
    model_llm: "meta-llama/Llama-3.1-8B-Instruct"
    base_url: "http://localhost:8000/v1"
    threads: 8

  "my-hosted-model":
    model_llm: "openai/gpt-oss-120b"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "OPEN_ROUTER_API_KEY"

model_key: "my-local-model"
