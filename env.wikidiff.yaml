# Diff two AOP-Wiki quarterly releases — Key Events, their free-text fields, and their
# curated KEC (object/process/action) triples. Used to quantify how much the structured
# layer actually moves between releases, which is what the paper's Discussion reports:
# most edits are free text, and the curated triple count barely changes.
#
# Both releases are parsed from scratch here (get_xsd + parse_pydantic per version) rather
# than reusing a KEC run's output, so the diff does not depend on which subset a KEC run
# happened to process.

aop_xml:
  "20260401":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-04-01.xml"
  "20260701":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-07-01.xml"

# Which two releases to compare. Both must appear in `aop_xml` above, and their XML files
# must be present locally — `resources/aopwiki/` is gitignored (third-party data, not
# redistributed), so fetch the exports from the AOP-Wiki downloads page yourself.
version_old: "20260401"
version_new: "20260701"

# Local, gitignored, same convention as env.kec.yaml's `products/kec116`. Holds both
# parsed releases ({{products}}/{{version}}/aop.json, ~200 MB each) and the diff report
# beside them; only the small report files are worth copying into the data repo.
products: "products/wikidiff"
