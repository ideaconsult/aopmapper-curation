aop_xml:
  "20260701":
    sources:
      xsd_url: "https://raw.githubusercontent.com/swandle06/AopXml/2.7.0/assets/schema/current.xsd"
      xml_file_path: "resources/aopwiki/aop-wiki-xml-2026-07-01.xml"

version: "20260701"

# This pipeline's own output root (ke_graph lookup.json, solr/ docs, assay_technique_stats.json).
products: "../aopmapper-curation-data/aopwiki_20260701/curated"

# Assay consensus products (pipeline.assays_consensus.yaml's `products`). The task appends
# "assays/<model_key>/validate_assay_iris.tsv" itself, so this is the PARENT, not .../assays.
assays_products: "../aopmapper-curation-data/aopwiki_20260701/ASSAYS"
# Cross-model run name. NOTE: pipeline.yaml currently builds
# {{assays_products}}/{{assays_crossmodel}}/viz_assay_consensus.json, but the file is at
# {{assays_products}}/crossmodel/{{assays_crossmodel}}/ - see pipeline.yaml line 38.
assays_crossmodel: "manuscript"
# keep an assay consensus cluster if this many models produced it
assay_min_support: 2

# Assay-name synonym map (tasks/assay_synonyms_update.py, runs before assay_consensus2solr):
# merge name pairs with SapBERT cosine >= threshold (star grouping, canonical absorbs only its
# direct neighbours). The hard veto (digit/roman numeral, Greek/subunit, antonym differences
# are never merged) is on by default; turn it off only to reproduce unvetoed behaviour.
assay_synonym_threshold: 0.90
assay_synonym_veto: true
assay_synonym_embedding_model: "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
