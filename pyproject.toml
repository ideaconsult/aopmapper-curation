[project]
name = "aopmapper-curation"
version = "0.1.0"
description = "LLM-based curation pipeline for AOP-Wiki Key Events and assays (AOPMapper)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.13"

dependencies = [
    "xsdata[cli]>=24.12",
    "xsdata-pydantic[cli,lxml]>=24.5",
    "ploomber>=0.23.3",
    "pydantic>=2.0",
    "httpx>=0.27",
    "requests>=2.31",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "matplotlib>=3.10.1",
    "beautifulsoup4>=4.13.4",
    "sentence-transformers>=5.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
